<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter, sans-serif;
    background:#03050b;
    color:#f4f7ff;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;

    background:
        radial-gradient(circle at 15% 20%, rgba(0,220,255,.12), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(150,70,255,.12), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(255,0,150,.08), transparent 30%);

    pointer-events:none;
}

.grid{
    position:fixed;
    inset:0;
    z-index:-2;
    opacity:.16;

    background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);

    background-size:55px 55px;

    mask-image:linear-gradient(to bottom,black,transparent);
}


/* =========================================================
   PARTICLES
========================================================= */

#particles{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    position:fixed;

    top:18px;
    left:50%;
    transform:translateX(-50%);

    width:min(1100px,calc(100% - 30px));

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:12px 18px;

    border:1px solid rgba(255,255,255,.09);

    background:rgba(5,8,18,.65);

    backdrop-filter:blur(20px);

    border-radius:18px;

    z-index:1000;

    box-shadow:
        0 15px 50px rgba(0,0,0,.3);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-family:"Space Grotesk";
    font-weight:700;
    letter-spacing:-.5px;
}

.logo-box{
    width:34px;
    height:34px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:linear-gradient(135deg,#00e5ff,#8d5cff);

    color:#02030a;

    font-weight:800;

    box-shadow:0 0 25px rgba(0,220,255,.3);
}

.nav-links{
    display:flex;
    gap:22px;

    font-size:13px;

    color:#9ba5ba;
}

.nav-links a{
    transition:.25s;
}

.nav-links a:hover{
    color:white;
}

@media(max-width:700px){

    .nav-links{
        display:none;
    }

}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    max-width:1200px;

    margin:auto;

    padding:
        150px 30px
        80px;

    display:grid;

    grid-template-columns:1fr 1fr;

    align-items:center;

    gap:50px;
}

@media(max-width:850px){

    .hero{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero-actions{
        justify-content:center;
    }

    .hero-visual{
        order:-1;
    }

}


/* =========================================================
   HERO TEXT
========================================================= */

.eyebrow{

    font-family:"JetBrains Mono";

    color:#61eaff;

    font-size:12px;

    letter-spacing:2px;

    margin-bottom:20px;

    text-transform:uppercase;

}

.hero h1{

    font-family:"Space Grotesk";

    font-size:clamp(45px,7vw,88px);

    line-height:.95;

    letter-spacing:-5px;

    margin-bottom:25px;

}

.hero h1 span{

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #67e9ff,
            #a178ff
        );

    -webkit-background-clip:text;

    color:transparent;

}

.hero-description{

    max-width:650px;

    color:#9ca7bc;

    font-size:17px;

    line-height:1.8;

}

.hero-actions{

    display:flex;

    gap:12px;

    margin-top:30px;

    flex-wrap:wrap;

}

.btn{

    padding:13px 19px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.1);

    transition:.3s;

    font-weight:600;

    font-size:14px;

}

.btn-primary{

    background:#fff;

    color:#05070d;

}

.btn-secondary{

    background:rgba(255,255,255,.04);

}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 35px rgba(0,0,0,.4);

}


/* =========================================================
   3D CORE
========================================================= */

.hero-visual{

    display:grid;

    place-items:center;

    perspective:1000px;

}

.core{

    width:370px;

    height:370px;

    max-width:80vw;

    max-height:80vw;

    position:relative;

    transform-style:preserve-3d;

    transition:transform .2s ease-out;

}

.core-center{

    position:absolute;

    width:145px;
    height:145px;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%)
        translateZ(50px);

    border-radius:50%;

    display:grid;
    place-items:center;

    font-family:"Space Grotesk";

    font-size:42px;

    font-weight:700;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #7feeff 12%,
            #613cff 50%,
            #09001b 75%
        );

    color:white;

    box-shadow:
        0 0 35px #5deaff,
        0 0 90px rgba(106,70,255,.5),
        inset 0 0 40px rgba(255,255,255,.4);

    animation:pulse 4s infinite ease-in-out;

}

@keyframes pulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            translateZ(50px)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            translateZ(50px)
            scale(1.07);
    }

}

.orbit{

    position:absolute;

    top:50%;
    left:50%;

    border:1px solid rgba(100,230,255,.35);

    border-radius:50%;

    transform-style:preserve-3d;

}

.orbit1{

    width:260px;
    height:110px;

    transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateZ(15deg);

    animation:orbit1 9s linear infinite;

}

.orbit2{

    width:320px;
    height:140px;

    transform:
        translate(-50%,-50%)
        rotateX(70deg)
        rotateY(25deg);

    animation:orbit2 13s linear infinite reverse;

}

.orbit3{

    width:350px;
    height:350px;

    border-color:rgba(160,100,255,.25);

    transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateY(25deg);

    animation:orbit3 18s linear infinite;

}

@keyframes orbit1{

    from{
        transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateZ(0);
    }

    to{
        transform:
        translate(-50%,-50%)
        rotateX(65deg)
        rotateZ(360deg);
    }

}

@keyframes orbit2{

    from{
        transform:
        translate(-50%,-50%)
        rotateX(70deg)
        rotateY(25deg)
        rotateZ(0);
    }

    to{
        transform:
        translate(-50%,-50%)
        rotateX(70deg)
        rotateY(25deg)
        rotateZ(360deg);
    }

}

@keyframes orbit3{

    from{
        transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateY(25deg)
        rotateZ(0);
    }

    to{
        transform:
        translate(-50%,-50%)
        rotateX(68deg)
        rotateY(25deg)
        rotateZ(360deg);
    }

}

.node{

    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#70edff;

    box-shadow:0 0 20px #70edff;

}

.node:nth-child(1){
    top:10%;
    left:20%;
}

.node:nth-child(2){
    right:8%;
    top:45%;
    background:#
